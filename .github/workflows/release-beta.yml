name: Windows Beta Release

on:
  push:
    branches:
      - release/beta
    paths:
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
  # Crash reporting (GlitchTip). PUBLIC ingest DSN — safe to inline (a DSN only
  # permits SENDING events, never reading them). The local .env is gitignored so
  # it is absent in CI; without this, Windows builds would ship crash reporting
  # DARK while macOS/iOS/Android (built locally, which load .env) would not.
  VITE_GLITCHTIP_DSN: https://57410cbbd65b489784e43f0eff1e91bc@crash.markflow.jp/1
  # Cloud config (Firebase / AI proxy / Yjs / Google OAuth). Read at BUILD time
  # from import.meta.env.VITE_* (src/services/firebase.ts). The local .env is
  # gitignored so it is absent in CI — WITHOUT these, CI-built Windows binaries
  # ship with EMPTY config: no login, no Firestore sync, no image upload, no AI,
  # no realtime collaboration (regression that shipped silently since v0.4.0).
  # These are client-side public config (Firebase web keys / OAuth client id /
  # public URLs), stored as repo Secrets to avoid hardcoding them in source.
  VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
  VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
  VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
  VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
  VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
  VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
  VITE_AI_PROXY_URL: ${{ secrets.VITE_AI_PROXY_URL }}
  VITE_YJS_WEBSOCKET_URL: ${{ secrets.VITE_YJS_WEBSOCKET_URL }}
  VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install

      - name: Build (Windows x64)
        run: pnpm tauri build --bundles nsis

      # Fail-closed: prove the cloud config was actually baked into the bundle.
      # If a VITE_* secret is missing/renamed, Firebase config would be empty and
      # the app would ship with cloud DARK — surface that as a hard build failure
      # here instead of silently publishing a broken Windows binary.
      - name: Assert cloud config baked into bundle
        shell: bash
        run: |
          if ! grep -rq "firebaseapp.com" dist/assets/*.js; then
            echo "::error::Firebase config is MISSING from the built bundle — VITE_* secrets not injected. Refusing to publish a cloud-dark Windows build."
            exit 1
          fi
          echo "OK: Firebase config present in bundle."

      - name: Get version and artifacts
        id: info
        shell: bash
        run: |
          VERSION=$(jq -r .version package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          EXE=$(ls src-tauri/target/release/bundle/nsis/*.exe | grep -v '\.sig$' | head -1)
          SIG=$(ls src-tauri/target/release/bundle/nsis/*.exe.sig | head -1)
          echo "exe=$EXE" >> "$GITHUB_OUTPUT"
          echo "sig=$SIG" >> "$GITHUB_OUTPUT"
          echo "exe_name=$(basename $EXE)" >> "$GITHUB_OUTPUT"

      - name: Download existing beta.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release download beta --pattern "beta.json" --dir . --clobber 2>/dev/null || echo '{}' > beta.json

      - name: Update beta.json with Windows platform
        shell: bash
        run: |
          VERSION="${{ steps.info.outputs.version }}"
          WIN_SIG=$(cat "${{ steps.info.outputs.sig }}")
          WIN_EXE="${{ steps.info.outputs.exe_name }}"

          # If beta.json has existing macOS entry, preserve it; otherwise create new
          if jq -e '.platforms["darwin-aarch64"]' beta.json >/dev/null 2>&1; then
            # Add/update Windows platform to existing JSON
            jq --arg sig "$WIN_SIG" \
               --arg url "https://github.com/momocham922/markflow/releases/download/beta/$WIN_EXE" \
               '.platforms["windows-x86_64"] = {"signature": $sig, "url": $url}' \
               beta.json > beta_updated.json
            mv beta_updated.json beta.json
          else
            # No existing release — create Windows-only JSON (macOS will be added by local script)
            jq -n --arg ver "$VERSION" \
                  --arg sig "$WIN_SIG" \
                  --arg url "https://github.com/momocham922/markflow/releases/download/beta/$WIN_EXE" \
              '{version: $ver, notes: ("Beta release v" + $ver), pub_date: (now | strftime("%Y-%m-%dT%H:%M:%SZ")), platforms: {"windows-x86_64": {signature: $sig, url: $url}}}' \
              > beta.json
          fi
          cat beta.json

      - name: Upload to beta release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # Delete old Windows assets if they exist
          gh release delete-asset beta "${{ steps.info.outputs.exe_name }}" --yes 2>/dev/null || true
          gh release delete-asset beta "${{ steps.info.outputs.exe_name }}.sig" --yes 2>/dev/null || true
          gh release delete-asset beta "beta.json" --yes 2>/dev/null || true

          # Upload new assets (create release if it doesn't exist)
          if gh release view beta >/dev/null 2>&1; then
            gh release upload beta \
              "${{ steps.info.outputs.exe }}" \
              "${{ steps.info.outputs.sig }}" \
              beta.json \
              --clobber
          else
            VERSION="${{ steps.info.outputs.version }}"
            gh release create beta \
              "${{ steps.info.outputs.exe }}" \
              "${{ steps.info.outputs.sig }}" \
              beta.json \
              --title "Beta v${VERSION}" \
              --notes "Beta release v${VERSION}" \
              --prerelease
          fi
