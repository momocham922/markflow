server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location /.well-known/ {
        default_type application/json;
    }

    # Auto-update manifests + artifacts: markflow.jp/updates/{latest,beta}.json
    # and the DMG/tar/exe payloads. Reverse-proxied to a public GCS bucket
    # (gs://markflow-updates) so the app updater no longer depends on public
    # GitHub Releases — this is what lets the GitHub repo be made private
    # (distribution migration, decision #1). See scripts/release-updates-gcs.sh.
    # Inert until the transition build ships with MARKFLOW_UPDATE_BASE set.
    location /updates/ {
        proxy_pass https://storage.googleapis.com/markflow-updates/;
        proxy_set_header Host storage.googleapis.com;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # Pass GCS's per-object Cache-Control through unchanged: the release script
        # (release-updates-gcs.sh) uploads manifests with no-cache and artifacts
        # with immutable max-age. Do NOT force a blanket header here — that would
        # strip the immutable caching from the multi-MB payloads.
    }

    # Published documents: markflow.jp/p/{docId} → ai-proxy serves the HTML
    # from Storage (published/{docId}.html). Keeps a clean custom-domain URL.
    location /p/ {
        proxy_pass https://markflow-ai-proxy-636447248627.asia-northeast1.run.app;
        proxy_set_header Host markflow-ai-proxy-636447248627.asia-northeast1.run.app;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /share/ {
        try_files $uri /share/index.html;
    }

    location /delete-account {
        try_files $uri /delete-account/index.html;
    }

    location /privacy {
        try_files $uri /privacy/index.html;
    }

    # Stripe Checkout return pages. Stripe requires https success/cancel URLs;
    # these static pages redirect back into the app via markflow://billing/*.
    location /checkout/success {
        try_files $uri /checkout/success/index.html;
    }

    location /checkout/cancel {
        try_files $uri /checkout/cancel/index.html;
    }

    # Stripe billing-portal return page. The portal's return_url points here;
    # the static page redirects back into the app via markflow://billing/updated.
    location /account {
        try_files $uri /account/index.html;
    }
}
