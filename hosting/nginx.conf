server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location /.well-known/ {
        default_type application/json;
    }

    # Published documents: markflow.jp/p/{docId} → ai-proxy serves the HTML
    # from Storage (published/{docId}.html). Keeps a clean custom-domain URL.
    location /p/ {
        proxy_pass https://markflow-ai-proxy-636447248627.asia-northeast1.run.app;
        proxy_set_header Host markflow-ai-proxy-636447248627.asia-northeast1.run.app;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /share/ {
        try_files $uri /share/index.html;
    }

    location /delete-account {
        try_files $uri /delete-account/index.html;
    }

    location /privacy {
        try_files $uri /privacy/index.html;
    }

    # Stripe Checkout return pages. Stripe requires https success/cancel URLs;
    # these static pages redirect back into the app via markflow://billing/*.
    location /checkout/success {
        try_files $uri /checkout/success/index.html;
    }

    location /checkout/cancel {
        try_files $uri /checkout/cancel/index.html;
    }
}
