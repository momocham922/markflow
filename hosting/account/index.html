<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>お手続きが完了しました - MarkFlow</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0a0a0a;
        color: #fafafa;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        max-width: 460px;
        padding: 3rem;
        text-align: center;
      }
      .logo {
        font-size: 1.75rem;
        font-weight: 700;
        margin-bottom: 1.5rem;
      }
      h1 {
        font-size: 1.25rem;
        margin-bottom: 0.75rem;
      }
      p {
        color: #a1a1aa;
        font-size: 0.95rem;
        line-height: 1.7;
        margin-bottom: 1.5rem;
      }
      .btn {
        display: inline-block;
        padding: 0.7rem 1.75rem;
        border-radius: 0.5rem;
        font-size: 0.95rem;
        font-weight: 500;
        text-decoration: none;
        background: #6366f1;
        color: #fff;
        transition: opacity 0.2s;
      }
      .btn:hover {
        opacity: 0.85;
      }
      .hint {
        margin-top: 1rem;
        font-size: 0.8rem;
        color: #71717a;
      }
    </style>
    <script>
      // Return from the Stripe billing portal. Bounce back into the app via the
      // custom scheme so it can dismiss the in-app browser and re-poll the plan
      // (which may have changed: upgrade / downgrade / cancel-at-period-end).
      // Harmless if the app isn't installed (the button below is the fallback).
      (function () {
        try {
          window.location.href = "markflow://billing/updated";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div class="card">
      <div class="logo">MarkFlow</div>
      <h1>お手続きが完了しました</h1>
      <p>
        サブスクリプションの変更を受け付けました。アプリに戻ると最新のプランが自動的に反映されます。反映まで数秒かかる場合があります。
      </p>
      <a class="btn" href="markflow://billing/updated">アプリに戻る</a>
      <p class="hint">このタブは閉じていただいて構いません。</p>
    </div>
  </body>
</html>
