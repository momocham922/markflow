<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarkFlow - Markdown Editor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0a0a0a; color: #fafafa; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { max-width: 480px; padding: 3rem; text-align: center; }
    .logo { font-size: 2.5rem; font-weight: 700; margin-bottom: 0.25rem; }
    .tagline { color: #a1a1aa; margin-bottom: 2.5rem; font-size: 1rem; }
    .features { text-align: left; margin-bottom: 2.5rem; }
    .features li { color: #d4d4d8; font-size: 0.9rem; margin-bottom: 0.5rem; list-style: none; padding-left: 1.5rem; position: relative; }
    .features li::before { content: "•"; position: absolute; left: 0; color: #6366f1; }
    .btn { display: inline-block; padding: 0.75rem 2rem; border-radius: 0.5rem; font-size: 1rem; font-weight: 500; text-decoration: none; margin: 0.25rem; transition: opacity 0.2s; }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: #6366f1; color: #fff; }
    .btn-outline { background: transparent; color: #a1a1aa; border: 1px solid #3f3f46; }
    .platforms { display: flex; justify-content: center; gap: 2rem; margin-top: 2rem; font-size: 0.8rem; color: #71717a; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">MarkFlow</div>
    <p class="tagline">Cross-platform Markdown Editor</p>
    <ul class="features">
      <li>リアルタイムプレビュー &amp; 共同編集</li>
      <li>AIアシスタント &amp; 音声入力</li>
      <li>マインドマップ &amp; Mermaidダイアグラム</li>
      <li>カスタムテーマ &amp; コードハイライト</li>
      <li>クラウド同期 &amp; オフライン対応</li>
    </ul>
    <a class="btn btn-primary" href="https://github.com/momocham922/markflow/releases/latest">Download</a>
    <div class="platforms">
      <span>macOS</span>
      <span>Windows</span>
      <span>iOS</span>
      <span>Android</span>
    </div>
  </div>
</body>
</html>
