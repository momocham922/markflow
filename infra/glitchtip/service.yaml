apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: glitchtip
  labels:
    cloud.googleapis.com/location: asia-northeast1
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/cloudsql-instances: markflow-app-2026:asia-northeast1:glitchtip-db
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/container-dependencies: '{"glitchtip":["cloudsql-proxy"]}'
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "3"
    spec:
      serviceAccountName: 636447248627-compute@developer.gserviceaccount.com
      timeoutSeconds: 300
      containers:
        - name: glitchtip
          image: docker.io/glitchtip/glitchtip:6.2.6
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: SERVER_ROLE
              value: all_in_one
            - name: VALKEY_URL
              value: ""
            - name: GLITCHTIP_DOMAIN
              value: https://crash.markflow.jp
            - name: DEFAULT_FROM_EMAIL
              value: crash@markflow.jp
            - name: EMAIL_URL
              value: consolemail://
            - name: ENABLE_USER_REGISTRATION
              value: "False"
            - name: ENABLE_ORGANIZATION_CREATION
              value: "False"
            - name: CSRF_TRUSTED_ORIGINS
              value: https://crash.markflow.jp,https://glitchtip-636447248627.asia-northeast1.run.app
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: glitchtip-secret-key
                  key: latest
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: glitchtip-database-url
                  key: latest
          resources:
            limits:
              cpu: "1"
              memory: 2Gi
          startupProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
        - name: cloudsql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.25.3
          args:
            # Bind all interfaces so the Cloud Run startup probe (which does not
            # hit the container loopback) can reach 5432; GlitchTip still dials
            # 127.0.0.1:5432 over the shared localhost.
            - "--address=0.0.0.0"
            - "--port=5432"
            - "markflow-app-2026:asia-northeast1:glitchtip-db"
          resources:
            limits:
              memory: 256Mi
          startupProbe:
            tcpSocket:
              port: 5432
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 20
